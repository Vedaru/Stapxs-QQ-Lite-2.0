# Build Stapxs QQ Lite for Linux (deb + AppImage) from this repo's source and
# attach the bundles to a Forgejo release.
#
# This repo is a patch branch of Stapxs/Stapxs-QQ-Lite-2.0 (upstream, AGPL-3.0).
# The patch is the "窗口模糊边框" setting: upstream's desktop window is a floating
# card -- a 10px transparent ring and 7px transparent corner notches, from
# #app's margin/border-radius plus `background: none` in
# src/renderer/src/assets/css/append/append_linux.css. Those pixels are never
# drawn, so on a compositor that fills what the client did not paint (Hyprland's
# decoration:blur, KWin) the ring shows up as blurred wallpaper around the
# window. The patch makes the filled window the default and moves the card look
# behind `html.win-blur-border`, driven by the opt_win_blur_border setting.
#
# runs-on: vedaru-laptop is this laptop's own runner -- see
# ~/.local/share/forgejo-runner, label `vedaru-laptop`, host backend. Host
# rather than container, because this job needs the rust toolchain under
# ~/.cargo and the WebKitGTK/GTK dev packages that tauri's build links against,
# both of which are installed on this host and in no container image here.
#
# NOT ubuntu-latest: the Forgejo server's runner claims that label too, so an
# ubuntu-latest job races between the two hosts and can land on the server, in
# an Alpine container with none of this host's /usr or ~/.cargo trees. The two
# hosts hold disjoint labels on purpose (vedaru-laptop here, glibc on the
# server); see chezmoi commit 0d96cb4.
#
# The build runs on the machine the author works on, so it is pushed to the back
# of the scheduler rather than allowed to take the box: every heavy step is
# `nice -n 19`, and cargo is capped to well under nproc. The point is that a
# build queued by a push must not repeat the incident where an unniced
# 24-way cargo build made the whole desktop stutter. A slower build is the
# intended trade.
#
# There is deliberately no actions/checkout step. The default action source is
# github.com -- the one host this setup exists to avoid -- so the fetch below
# clones over git, with the same per-command credential helper and IPv4 pin
# bootstrap.sh uses.

name: Build and publish the Linux desktop bundle

on:
  push:
    # Version-suffixed on purpose (patches/v3.5.0, patches/v3.6.0, ...): the
    # glob keeps a future rebase branch building without touching this file.
    branches: ['patches/**']
  workflow_dispatch:

jobs:
  package:
    runs-on: vedaru-laptop
    # A cold build compiles the whole tree, vendored OpenSSL included, and the
    # deprioritised compile above is deliberately slow. Comfortably over
    # act_runner's own default so the ceiling is stated here, not inherited.
    timeout-minutes: 240
    steps:
      - name: Fetch this repo and its submodules
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          ref='${{ github.ref_name }}'
          repo='${{ github.repository }}'
          [ -n "$ref" ] || { echo "github.ref_name is empty" >&2; exit 1; }
          [ -n "$repo" ] || { echo "github.repository is empty" >&2; exit 1; }

          # Cloudflare completes TCP on its IPv6 addresses and then drops the
          # TLS ClientHello, and libcurl does not retry the next address after a
          # TLS failure. http.curloptResolve (git >= 2.46) pins the name to one
          # IPv4 address, with SNI and the certificate still valid.
          ip=$(getent ahostsv4 git.vedaru.cn | awk 'NR==1 {print $1}')
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          src="$RUNNER_TEMP/stapxs-src"
          rm -rf "$src"
          # --branch, not a bare clone: this repo carries the patch branches
          # alongside the upstream lines, and the branch that fired the job is
          # the one to build. --depth 1 is enough, nothing here reads history.
          git -c credential.helper= -c "credential.helper=$helper" \
              -c "http.curloptResolve=git.vedaru.cn:443:$ip" \
              clone --quiet --depth 1 --branch "$ref" \
              "https://git.vedaru.cn/$repo.git" "$src"
          echo "building $ref at $(git -C "$src" rev-parse --short HEAD)"

          # Both submodules are pinned to upstream github.com commits and are
          # not mirrored here. They are public, so the credential helpers are
          # turned off for this fetch instead of left to hand the runner's
          # github.com token to a clone that does not need one.
          #
          # --depth 1 first: QFace is ~139 MB of sticker sprites and its
          # history dwarfs its working tree. The fallback is because a shallow
          # fetch of a pinned, non-tip commit only works when the server allows
          # it, and GitHub's answer to that has changed before -- a build that
          # silently got the wrong submodule revision is not worth the speedup.
          git -C "$src" -c credential.helper= submodule update --init --recursive --depth 1 \
            || git -C "$src" -c credential.helper= submodule update --init --recursive
          # The build reads both. `git submodule update` returning 0 with an
          # empty working tree is not a documented state, but it is the one
          # failure that would show up as a confusing vite error much later.
          for sub in src/renderer/src/assets/img/qq-face src/renderer/public/bcui; do
            [ -n "$(ls -A "$src/$sub" 2>/dev/null)" ] || {
              echo "submodule $sub is empty after checkout" >&2
              exit 1
            }
          done

      - name: Install the JS dependencies
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/stapxs-src"
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v node >/dev/null || { echo "node not on PATH" >&2; exit 1; }
          command -v cargo >/dev/null || { echo "cargo not on PATH" >&2; exit 1; }

          # Tauri's beforeBuildCommand is the bare word `yarn build`, and this
          # repo ships Yarn 4 through .yarnrc.yml's yarnPath instead of a PATH
          # install -- there is no `yarn` binary anywhere on this host. The shim
          # puts the repo's own release behind that name for both the outer
          # invocation and the one tauri spawns, and cd's to the checkout
          # because tauri runs the before-command from its own working directory
          # (the app dir) while `build` has to run at the repo root.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/yarn" <<EOF
          #!/bin/sh
          cd "$src" || exit 1
          exec node "$src/.yarn/releases/yarn-4.12.0.cjs" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/yarn"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          yarn --version

          # --immutable: a build that quietly resolved a lockfile no longer
          # matching package.json would publish a bundle nobody asked for.
          # Failing here is the cheaper surprise.
          nice -n 19 yarn install --immutable

      - name: Build the desktop bundle
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/stapxs-src"
          export PATH="$HOME/.cargo/bin:$RUNNER_TEMP/bin:$PATH"

          # A third of the cores, not all of them: the last build on this
          # machine did not run out of CPU, it ran out of memory. rustc peaks
          # high on this dependency tree (vendored OpenSSL via
          # bundled-sqlcipher-vendored-openssl, warp, tauri) and 24 concurrent
          # invocations pushed the box into swap, which is what made the
          # desktop stutter. nice(1) cannot help with that, so cap the width.
          jobs=$(( $(nproc) / 3 ))
          [ "$jobs" -ge 2 ] || jobs=2
          export CARGO_BUILD_JOBS=$jobs
          echo "building with CARGO_BUILD_JOBS=$jobs under nice -n 19"

          # deb + AppImage: the two the author installs. bundle.targets says
          # "all", which on Linux also means rpm -- an archetype with no
          # rpmbuild on this host and no user here.
          set +e
          nice -n 19 yarn run build:tauri --bundles deb,appimage
          status=$?
          set -e

          # Collect before judging. The compile only happens once, so a failed
          # AppImage bundling -- linuxdeploy wants FUSE -- must not throw away a
          # perfectly good .deb. `$src` was rm -rf'd two steps ago, so nothing
          # found here can be a leftover from an earlier run, and a stale
          # artifact cannot be published by accident.
          found=$(find "$src/src/tauri/target" -type f -path '*/bundle/*' \
                       \( -name '*.deb' -o -name '*.AppImage' \) | sort)
          if [ -z "$found" ]; then
            echo "tauri build exited $status and produced no bundle" >&2
            exit 1
          fi
          [ "$status" -eq 0 ] ||
            echo "::warning::tauri build exited $status; publishing the bundles it did produce"
          echo "$found"

      # Before publishing, and not after: the artifact is the only copy that
      # exists anywhere until the release upload succeeds.
      #
      # This exists because the release is not actually downloadable. The
      # Forgejo instance sits behind an SSO reverse proxy that 302s every path
      # outside /api/ to auth.vedaru.cn, so a release asset cannot be fetched
      # with a credential -- `Authorization: token`, basic auth and ?token= all
      # come back as the login page -- and no /api/ route streams asset
      # content. The runner is on the same host as the author, so the copy is
      # a local `install(1)` with no network in it at all, which also skips the
      # slow uplink. STAPXS_ARTIFACT_DIR moves the destination.
      - name: Stage the bundles for a local install
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/stapxs-src"
          dest="${STAPXS_ARTIFACT_DIR:-$HOME/Downloads}"
          mkdir -p "$dest"
          staged=0
          while IFS= read -r f; do
            name=$(basename "$f" | tr ' ' '-')
            install -m 0644 "$f" "$dest/$name"
            echo "staged $dest/$name ($(du -h "$f" | cut -f1))"
            staged=$((staged + 1))
          done < <(find "$src/src/tauri/target" -type f -path '*/bundle/*' \
                        \( -name '*.deb' -o -name '*.AppImage' \) | sort)
          [ "$staged" -gt 0 ] || { echo "nothing was staged" >&2; exit 1; }

      - name: Publish the bundles to a Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/stapxs-src"
          repo='${{ github.repository }}'
          sha='${{ github.sha }}'
          api="https://git.vedaru.cn/api/v1/repos/$repo"
          auth=(-H "Authorization: token $FORGEJO_TOKEN")

          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' \
                       "$src/package.json")
          tag="v$version"
          echo "publishing $tag at $sha"

          # Find-or-create the release. A 404 is the only expected answer; any
          # other non-200 is a real failure and must be loud rather than
          # silently re-attributed to "missing".
          http=$(curl -4 -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
                      "${auth[@]}" "$api/releases/tags/$tag")
          case "$http" in
            200) echo "release $tag already exists; replacing its assets" ;;
            404)
              # target_commitish matters: without it Forgejo cuts the new tag
              # from the repo's default branch, which this repo does not use --
              # the release would then point at a tree nobody built.
              python3 - "$tag" "$sha" > "$RUNNER_TEMP/new-release.json" <<'PY'
          import json, sys
          tag, sha = sys.argv[1], sys.argv[2]
          json.dump({
              "tag_name": tag,
              "target_commitish": sha,
              "name": f"Stapxs QQ Lite {tag} (窗口模糊边框 patch)",
              "body": (
                  "Linux desktop build of this repo's patch branch.\n\n"
                  "The window fills its frame. Upstream's floating card look -- "
                  "a transparent 10px ring and rounded corners, which a blurring "
                  "compositor (Hyprland's `decoration:blur`, KWin) fills with "
                  "wallpaper -- is behind the “窗口模糊边框” switch in "
                  "主题与颜色.\n\n"
                  "Install with `sudo apt install ./stapxs-qq-lite-*.deb`, or "
                  "`chmod +x` the AppImage and run it."
              ),
              "draft": False,
              "prerelease": False,
          }, sys.stdout)
          PY
              http=$(curl -4 -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
                          -X POST "${auth[@]}" -H 'Content-Type: application/json' \
                          --data-binary "@$RUNNER_TEMP/new-release.json" "$api/releases")
              if [ "$http" != 201 ]; then
                echo "creating release $tag failed: HTTP $http" >&2
                cat "$RUNNER_TEMP/release.json" >&2
                exit 1
              fi
              echo "created release $tag" ;;
            *)  echo "looking up release $tag failed: HTTP $http" >&2
                cat "$RUNNER_TEMP/release.json" >&2
                exit 1 ;;
          esac

          id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' \
                    "$RUNNER_TEMP/release.json")
          echo "release id $id"

          # Re-push, same version: drop the asset of every name we are about to
          # upload so the upload does not collide with the previous run. Assets
          # under other names are left alone.
          curl -4 -fsS "${auth[@]}" "$api/releases/$id/assets" -o "$RUNNER_TEMP/assets.json"
          python3 - "$RUNNER_TEMP/assets.json" > "$RUNNER_TEMP/assets.tsv" <<'PY'
          import json, sys
          for a in json.load(open(sys.argv[1])):
              print(f"{a['id']}\t{a['name']}")
          PY

          upload_names=()
          while IFS= read -r f; do
            # Tauri names the deb after the product name, spaces and all. A name
            # with spaces in it is a nuisance to type and to URL-encode, and
            # dpkg reads its metadata from inside the archive, so normalise.
            name=$(basename "$f" | tr ' ' '-')
            upload_names+=("$name")
            while IFS=$'\t' read -r asset_id asset_name; do
              [ "$asset_name" = "$name" ] || continue
              code=$(curl -4 -sS -o /dev/null -w '%{http_code}' -X DELETE \
                          "${auth[@]}" "$api/releases/$id/assets/$asset_id")
              echo "  replaced existing asset $asset_name (HTTP $code)"
            done < "$RUNNER_TEMP/assets.tsv"

            q=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")
            code=$(curl -4 -sS -o "$RUNNER_TEMP/upload.json" -w '%{http_code}' \
                        -X POST "${auth[@]}" -F "attachment=@$f" \
                        "$api/releases/$id/assets?name=$q")
            [ "$code" = 201 ] || {
              echo "uploading $name failed: HTTP $code" >&2
              cat "$RUNNER_TEMP/upload.json" >&2
              exit 1
            }
            echo "  uploaded $name ($(du -h "$f" | cut -f1))"
          done < <(find "$src/src/tauri/target" -type f -path '*/bundle/*' \
                        \( -name '*.deb' -o -name '*.AppImage' \) | sort)

          # Read the release back rather than trusting the upload responses: a
          # green job whose release is missing an asset is the one failure the
          # author would only find out about at install time.
          curl -4 -fsS "${auth[@]}" "$api/releases/$id/assets" -o "$RUNNER_TEMP/final.json"
          for name in "${upload_names[@]}"; do
            python3 - "$RUNNER_TEMP/final.json" "$name" <<'PY'
          import json, sys
          names = {a["name"] for a in json.load(open(sys.argv[1]))}
          sys.exit(0 if sys.argv[2] in names else 1)
          PY
            echo "  verified $name is on the release"
          done

          url="https://git.vedaru.cn/$repo/releases/tag/$tag"
          echo "published $url"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Stapxs QQ Lite $tag"
              echo
              echo "Built from \`${sha:0:7}\` on \`${{ github.ref_name }}\`."
              echo
              for name in "${upload_names[@]}"; do echo "- \`$name\`"; done
              echo
              echo "[Release]($url)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
